# Integracion continua de la aplicacion movil: estandar de codificacion,
# pruebas y compilacion automatica del APK y de la version de iOS.
name: Compilacion del APK y de iOS

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.6"
          channel: stable
          cache: true

      - name: Variables de entorno
        env:
          # Direcciones del servidor y de la web, definidas como variables
          # del repositorio; si faltan, la aplicación usa sus valores por
          # defecto
          API_URL: ${{ vars.API_URL }}
          WEB_URL: ${{ vars.WEB_URL }}
        run: |
          echo "API_URL=$API_URL" > .env
          echo "WEB_URL=$WEB_URL" >> .env

      - name: Configuración de Firebase
        env:
          # Contenido de android/app/google-services.json, guardado como
          # secreto del repositorio (el archivo no se sube a Git)
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json

      - name: Dependencias
        run: flutter pub get

      - name: Formato (Effective Dart)
        run: dart format --output=none --set-exit-if-changed lib test integration_test test_driver

      - name: Analisis estatico (Effective Dart)
        run: flutter analyze

      - name: Pruebas
        run: flutter test

      - name: Compilar el APK
        run: flutter build apk --release

      - name: Publicar el APK
        uses: actions/upload-artifact@v4
        with:
          name: karaoke-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

  ios:
    # iOS se compila en macOS sin firmar: no hace falta una Mac propia ni la
    # cuenta de Apple Developer; la firma se agrega al publicar en la App Store
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.6"
          channel: stable
          cache: true

      - name: Variables de entorno
        env:
          API_URL: ${{ vars.API_URL }}
          WEB_URL: ${{ vars.WEB_URL }}
        run: |
          echo "API_URL=$API_URL" > .env
          echo "WEB_URL=$WEB_URL" >> .env

      - name: Dependencias
        run: flutter pub get

      - name: Compilar la aplicacion de iOS
        run: flutter build ios --release --no-codesign

      - name: Empaquetar el IPA sin firmar
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qr karaoke-ios.ipa Payload

      - name: Publicar el IPA
        uses: actions/upload-artifact@v4
        with:
          name: karaoke-ios
          path: karaoke-ios.ipa
          retention-days: 30
