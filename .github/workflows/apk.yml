# Integracion continua de la aplicacion movil: estandar de codificacion,
# pruebas y compilacion automatica del APK.
name: Compilacion del APK

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.6"
          channel: stable
          cache: true

      - name: Dependencias
        run: flutter pub get

      - name: Formato (Effective Dart)
        run: dart format --output=none --set-exit-if-changed lib test integration_test test_driver

      - name: Analisis estatico (Effective Dart)
        run: flutter analyze

      - name: Pruebas
        run: flutter test

      - name: Compilar el APK
        env:
          # Direcciones del servidor y de la web, definidas como variables
          # del repositorio; si faltan, se usan los valores por defecto
          API_URL: ${{ vars.API_URL }}
          WEB_URL: ${{ vars.WEB_URL }}
        run: |
          ARGS=""
          if [ -n "$API_URL" ]; then ARGS="$ARGS --dart-define=API_URL=$API_URL"; fi
          if [ -n "$WEB_URL" ]; then ARGS="$ARGS --dart-define=WEB_URL=$WEB_URL"; fi
          flutter build apk --release $ARGS

      - name: Publicar el APK
        uses: actions/upload-artifact@v4
        with:
          name: karaoke-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
