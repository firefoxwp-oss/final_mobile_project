# Estandar de codificacion: Effective Dart, verificado con `flutter analyze`.
# Se parte de las reglas recomendadas de Flutter y se agregan los modos
# estrictos del analizador y las reglas de estilo de Effective Dart.
include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    # Las advertencias se tratan como errores: el codigo debe quedar limpio
    missing_required_param: error
    missing_return: error

linter:
  rules:
    # Estilo (Effective Dart: Style)
    - directives_ordering
    - lines_longer_than_80_chars
    - prefer_single_quotes
    - require_trailing_commas
    # Uso (Effective Dart: Usage)
    - prefer_final_fields
    - prefer_final_locals
    - prefer_final_in_for_each
    - unnecessary_lambdas
    - use_super_parameters
    - avoid_dynamic_calls
    # Diseno (Effective Dart: Design)
    - always_declare_return_types
    - type_annotate_public_apis
    - avoid_positional_boolean_parameters
    # Asincronia
    - unawaited_futures
    - discarded_futures
    # Documentacion (Effective Dart: Documentation)
    - slash_for_doc_comments
